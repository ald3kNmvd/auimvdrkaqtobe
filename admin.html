<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявки для обзвона</title>
<style>body{font:16px system-ui;background:#edf2f7;color:#173b62;margin:30px}main{background:white;padding:24px;border-radius:16px}input,select,button,textarea{font:inherit;padding:10px;margin:5px;border:1px solid #bac9da;border-radius:7px}button{cursor:pointer;background:#173b62;color:white}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:12px;text-align:left}textarea{width:180px}#tableWrap{overflow:auto}[hidden]{display:none!important}#message{color:#a42929}a{color:#175b99}</style>
<main><h1>Заявки для обзвона</h1><p id="message" role="status"></p>
<form id="login"><input id="email" type="email" autocomplete="username" placeholder="E-mail" required><input id="password" type="password" autocomplete="current-password" placeholder="Пароль" required><button>Войти</button></form>
<section id="panel" hidden><button id="logout">Выйти</button><button id="reload">Обновить</button><button id="export">Скачать CSV для Excel</button><p id="count"></p><input id="search" placeholder="ФИО, телефон, город, учебное заведение"><select id="filter"><option value="">Все статусы</option><option>Новая заявка</option><option>Позвонили</option><option>Заинтересован</option><option>Не дозвонились</option></select><div id="tableWrap"><table><thead><tr><th>Дата</th><th>ФИО / телефон</th><th>Город / учебное заведение</th><th>Образование</th><th>Направление / результат</th><th>Обзвон</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script><script src="database-config.js"></script><script src="admin.js"></script></html>
